<!DOCTYPE html>
<!--
    ============================================================
    Archivo: index.html

    Descripción:
    Define la página web que muestra la última medición almacenada
    y ofrece un botón para solicitar su actualización manual.

    Autor: Élia Garcia Pons
    Fecha: 14/10/2026

    Copyright:
    Uso académico - Proyecto de Biometría y Medio Ambiente.

    Aportación:
    Define la estructura visual consumida por app.js sin realizar
    directamente ninguna petición HTTP.
    ============================================================
-->
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Biometría - Sprint 0
    </title>

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>


<body>

    <main class="contenedor">

        <h1>
            Última medición
        </h1>


        <section class="medicion">

            <p>
                <strong>Valor:</strong>
                <span id="valor">
                    -
                </span>
            </p>


            <p>
                <strong>Fecha y hora:</strong>
                <span id="fechaHora">
                    -
                </span>
            </p>


            <p>
                <strong>Identificador del sensor:</strong>
                <span id="identificadorSensor">
                    -
                </span>
            </p>


            <p>
                <strong>Tipo:</strong>
                <span id="tipo">
                    -
                </span>
            </p>

        </section>

        <button id="botonActualizar" type="button"> Actualizar </button>

        <p
            id="error"
            class="error"
        ></p>

    </main>


    <!--
        Lógica frontend.

        Debe cargarse antes que app.js porque la interfaz
        utiliza LogicaFakeNavegador.
    -->
    <script
        src="../web_frontend_business_logic/LogicaFakeNavegador.js">
    </script>


    <!-- Interfaz gráfica. -->
    <script
        src="app.js">
    </script>

</body>

</html>
