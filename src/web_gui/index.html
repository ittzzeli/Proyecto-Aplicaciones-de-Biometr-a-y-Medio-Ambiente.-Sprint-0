<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mediciones</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>

<body>

    <!--
        Interfaz gráfica encargada de mostrar
        la última medición disponible.

        La GUI no realiza comunicaciones REST directamente.
    -->
    <main>

        <section class="medicion">

            <h1>Última medición</h1>

            <div class="datos">

                <span>Fecha</span>
                <span id="fecha">--</span>

                <span>Major</span>
                <span id="major">--</span>

                <span>Minor</span>
                <span id="minor">--</span>

                <span>TxPower</span>
                <span id="txPower">--</span>

            </div>

            <p
                id="error"
                hidden
            >
            </p>

        </section>

    </main>


    <!--
        Primero se carga la lógica de negocio fake/proxy.

        Está situada en un componente diferente de la GUI.
    -->
    <script
        src="../web_frontend_business_logic/LogicaFakeNavegador.js"
    ></script>


    <!--
        Después se carga la lógica propia de la interfaz.
    -->
    <script src="app.js"></script>

</body>

</html>
